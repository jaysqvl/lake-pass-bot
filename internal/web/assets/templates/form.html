{{define "content"}}
<section class="section-head"><div><p class="eyebrow">{{.Eyebrow}}</p><h1>{{.Heading}}</h1><p>{{.Description}}</p></div></section>
{{if .FormError}}<div class="flash error" id="form-error" tabindex="-1" role="alert">{{.FormError}}</div>{{end}}
<form{{if .SourceSelection}} id="source-form"{{end}} method="post" action="{{.ActionURL}}" class="form-card" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  {{range .HiddenFields}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">{{end}}
  {{range .Sections}}{{template "form-section" .}}{{end}}
  <div class="form-actions">{{if .SubmitHelp}}<p class="field-help">{{.SubmitHelp}}</p>{{end}}<div class="actions"><button class="primary" type="submit"{{if .SubmitDisabled}} disabled{{end}}>{{.SubmitLabel}}</button><a class="button ghost" href="{{.CancelURL}}">Cancel</a></div></div>
</form>
{{end}}
{{template "base" .}}
